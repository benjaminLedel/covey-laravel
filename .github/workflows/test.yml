name: test

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: "10.*", php: "8.1" }
          - { laravel: "10.*", php: "8.3" }
          - { laravel: "11.*", php: "8.2" }
          - { laravel: "11.*", php: "8.4" }
          - { laravel: "12.*", php: "8.2" }
          - { laravel: "12.*", php: "8.3" }
          - { laravel: "12.*", php: "8.4" }
          - { laravel: "13.*", php: "8.3" }
          - { laravel: "13.*", php: "8.4" }
          # The lower bounds in composer.json are a claim; this run holds the
          # package to it.
          - { laravel: "10.*", php: "8.1", stability: "prefer-lowest" }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} ${{ matrix.stability }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none
      # Laravel 10 and 11 are out of security support and every release of
      # them carries an advisory, which Composer refuses by default. Testing
      # against them is the point here, so the block is lifted for the build.
      - run: composer config audit.block-insecure false
      - run: composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.stability && format('--{0}', matrix.stability) || '' }}
      - run: vendor/bin/phpunit
